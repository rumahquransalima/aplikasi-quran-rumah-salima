name: Supabase Keepalive

# Ping Supabase setiap 8 jam agar project free tier tidak di-pause karena
# tidak ada aktivitas. Butuh repository secrets:
#   SUPABASE_URL              (contoh: https://xxxx.supabase.co)
#   SUPABASE_PUBLISHABLE_KEY  (atau SUPABASE_ANON_KEY)

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
        run: ./scripts/supabase_keepalive.sh
